name: Bench

# Performance regression detector. Uses github-action-benchmark to compare
# pytest-benchmark results and post as a PR comment.

on:
  pull_request:
    branches: [main]
    paths:
      - '**/*.py'
      - '**/pyproject.toml'
      - 'core/uv.lock'
      - 'contrib/uv.lock'
      - '.github/workflows/bench.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    name: Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0

      - name: Install core dependencies
        run: uv sync --all-packages
        working-directory: core

      - name: Install contrib dependencies
        run: uv sync --all-packages
        working-directory: contrib

      - name: Run core benchmarks
        run: |
          uv run pytest -m benchmark -p no:xdist \
            -o "addopts=--tb=short -q --import-mode=importlib" \
            --no-header \
            --benchmark-json=../core-output.json \
            --benchmark-disable-gc \
            --benchmark-min-rounds=5 || status=$?
          if [ "${status:-0}" -eq 5 ]; then
            echo "No benchmark markers found in core — skipping"
            rm -f ../core-output.json
          elif [ "${status:-0}" -ne 0 ]; then
            exit "$status"
          fi
        working-directory: core

      - name: Run contrib benchmarks
        run: |
          uv run pytest -m benchmark -p no:xdist \
            -o "addopts=--tb=short -q --import-mode=importlib" \
            --no-header \
            --benchmark-json=../contrib-output.json \
            --benchmark-disable-gc \
            --benchmark-min-rounds=5 || status=$?
          if [ "${status:-0}" -eq 5 ]; then
            echo "No benchmark markers found in contrib — skipping"
            rm -f ../contrib-output.json
          elif [ "${status:-0}" -ne 0 ]; then
            exit "$status"
          fi
        working-directory: contrib

      - name: Store core benchmark result
        if: hashFiles('core-output.json') != ''
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba  # v1.22.1
        with:
          tool: 'pytest'
          output-file-path: core-output.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-on-alert: true
          alert-threshold: '150%'
          summary-always: true
          comment-always: true
          fail-on-alert: false
          external-data-json-path: ./benchmark-data-core.json

      - name: Store contrib benchmark result
        if: hashFiles('contrib-output.json') != ''
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba  # v1.22.1
        with:
          tool: 'pytest'
          output-file-path: contrib-output.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-on-alert: true
          alert-threshold: '150%'
          summary-always: true
          comment-always: true
          fail-on-alert: false
          external-data-json-path: ./benchmark-data-contrib.json
