name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.repository }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python-code: ${{ steps.filter.outputs.python-code }}
      affected: ${{ steps.domains.outputs.affected || 'all' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d  # v4.0.1
        id: filter
        with:
          filters: |
            python-code:
              - '**/*.py'
              - '**/pyproject.toml'
              - 'core/uv.lock'
              - 'contrib/uv.lock'
              - 'Makefile'
              - '.github/workflows/ci.yml'
      - name: Detect affected domains
        id: domains
        if: github.event_name == 'pull_request'
        run: |
          CHANGED=$(git diff --name-only ${{ github.event.pull_request.base.sha }}...${{ github.sha }} 2>/dev/null || echo "")
          if [ -n "$CHANGED" ]; then
            AFFECTED=$(echo "$CHANGED" | ./scripts/affected-domains.sh)
          else
            AFFECTED=""
          fi
          if [ -z "$AFFECTED" ]; then
            AFFECTED="all"
          fi
          echo "affected<<EOF" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$AFFECTED" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "Affected domains: $AFFECTED"

  # ---------------------------------------------------------------------------
  # Format check (fast gate)
  # ---------------------------------------------------------------------------
  format:
    name: Format
    needs: [changes]
    if: needs.changes.outputs.python-code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            core/uv.lock
            contrib/uv.lock
      - name: Sync core
        run: uv sync --all-packages --no-progress
        working-directory: core
      - name: Sync contrib
        run: uv sync --all-packages --no-progress
        working-directory: contrib
      - name: Format check core
        run: uv run ruff format --check .
        working-directory: core
      - name: Format check contrib
        run: uv run ruff format --check .
        working-directory: contrib

  # ---------------------------------------------------------------------------
  # Lint — code quality
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    needs: [changes]
    if: needs.changes.outputs.python-code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            core/uv.lock
            contrib/uv.lock
      - name: Sync core
        run: uv sync --all-packages --no-progress
        working-directory: core
      - name: Sync contrib
        run: uv sync --all-packages --no-progress
        working-directory: contrib
      - name: Lint core
        run: uv run ruff check .
        working-directory: core
      - name: Lint contrib
        run: uv run ruff check .
        working-directory: contrib

  # ---------------------------------------------------------------------------
  # Type check — strict mypy on opted-in packages
  # ---------------------------------------------------------------------------
  typecheck:
    name: Type Check
    needs: [changes]
    if: needs.changes.outputs.python-code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            core/uv.lock
            contrib/uv.lock
      - name: Sync core
        run: uv sync --all-packages --no-progress
        working-directory: core
      - name: Sync contrib
        run: uv sync --all-packages --no-progress
        working-directory: contrib
      - name: Type check core
        run: uv run mypy
        working-directory: core
      - name: Type check contrib
        run: uv run mypy
        working-directory: contrib

  # ---------------------------------------------------------------------------
  # Test — pytest with coverage (fail_under = 85 configured in pyproject.toml)
  # ---------------------------------------------------------------------------
  test:
    name: Test (Python ${{ matrix.python-version }})
    needs: [changes]
    if: needs.changes.outputs.python-code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: |
            core/uv.lock
            contrib/uv.lock
      - name: Sync core
        run: uv sync --all-packages --no-progress
        working-directory: core
      - name: Sync contrib
        run: uv sync --all-packages --no-progress
        working-directory: contrib
      - name: Verify core lockfile is up-to-date
        run: uv lock --check
        working-directory: core
        continue-on-error: true
      - name: Verify contrib lockfile is up-to-date
        run: uv lock --check
        working-directory: contrib
        continue-on-error: true
      - name: Test core
        run: uv run pytest --cov --cov-report=xml:../core-coverage.xml --cov-report=term-missing
        working-directory: core
      - name: Test contrib
        run: uv run pytest --cov --cov-report=xml:../contrib-coverage.xml --cov-report=term-missing
        working-directory: contrib
      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v5
        with:
          files: core-coverage.xml,contrib-coverage.xml
          flags: python-${{ matrix.python-version }}
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ---------------------------------------------------------------------------
  # Architecture — layer dependency compliance via import-linter
  # ---------------------------------------------------------------------------
  architecture:
    name: Architecture
    needs: [changes]
    if: needs.changes.outputs.python-code == 'true' && (github.event_name == 'merge_group' || github.event_name == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            core/uv.lock
            contrib/uv.lock
      - name: Sync core
        run: uv sync --all-packages --no-progress
        working-directory: core
      - name: Sync contrib
        run: uv sync --all-packages --no-progress
        working-directory: contrib
      - name: Architecture check core
        run: uv run import-linter
        working-directory: core
      - name: Architecture check contrib
        run: uv run import-linter
        working-directory: contrib

  # ---------------------------------------------------------------------------
  # Gate: Aggregate status for branch protection
  # ---------------------------------------------------------------------------
  ci-status:
    name: CI Status
    if: always()
    needs: [changes, format, lint, typecheck, test, architecture]
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate results
        run: |
          results=(
            "${{ needs.changes.result }}"
            "${{ needs.format.result }}"
            "${{ needs.lint.result }}"
            "${{ needs.typecheck.result }}"
            "${{ needs.test.result }}"
            "${{ needs.architecture.result }}"
          )
          for r in "${results[@]}"; do
            if [[ "$r" == "failure" || "$r" == "cancelled" ]]; then
              echo "::error::CI failed — one or more jobs did not succeed."
              exit 1
            fi
          done
          echo "All CI checks passed ✓"
