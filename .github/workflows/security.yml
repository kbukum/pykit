name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d
        with:
          languages: python
          queries: security-and-quality
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d

  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          python-version: "3.13"
      - name: Export core requirements
        run: uv export --only-group dev --format requirements-txt --no-emit-workspace | grep -v '^-e ' > requirements-dev.txt
        working-directory: core
      - name: Audit core requirements
        run: uvx pip-audit -r core/requirements-dev.txt --strict --vulnerability-service osv
      - name: Export contrib requirements
        run: uv export --only-group dev --format requirements-txt --no-emit-workspace | grep -v '^-e ' > requirements-dev.txt
        working-directory: contrib
      - name: Audit contrib requirements
        run: uvx pip-audit -r contrib/requirements-dev.txt --strict --vulnerability-service osv

  bandit:
    name: Bandit SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          python-version: "3.13"
      - name: Run bandit on core
        run: uvx --from 'bandit[toml]' bandit -c pyproject.toml -lll -iii -r packages/ -f json -o ../bandit-core-report.json
        working-directory: core
        continue-on-error: true
      - name: Run bandit on contrib
        run: uvx --from 'bandit[toml]' bandit -c pyproject.toml -lll -iii -r . -x '**/.venv/**' -f json -o ../bandit-contrib-report.json
        working-directory: contrib
        continue-on-error: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: bandit-report
          path: |
            bandit-core-report.json
            bandit-contrib-report.json
