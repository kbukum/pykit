name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e
        with:
          languages: python
          queries: security-and-quality
      - uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e

  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
      - name: Export core requirements
        run: uv export --only-group dev --format requirements-txt --no-emit-workspace | grep -v '^-e ' > requirements-dev.txt
        working-directory: core
      - name: Audit core requirements
        run: uvx pip-audit -r core/requirements-dev.txt --strict --vulnerability-service osv
      - name: Export contrib requirements
        run: uv export --only-group dev --format requirements-txt --no-emit-workspace | grep -v '^-e ' > requirements-dev.txt
        working-directory: contrib
      - name: Audit contrib requirements
        run: uvx pip-audit -r contrib/requirements-dev.txt --strict --vulnerability-service osv

  bandit:
    name: Bandit SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
      - name: Sync core dev dependencies
        run: uv sync --only-group dev
        working-directory: core
      - name: Sync contrib dev dependencies
        run: uv sync --only-group dev
        working-directory: contrib
      - name: Run bandit on core
        run: uv run bandit -lll -iii -r packages/ -f json -o ../bandit-core-report.json
        working-directory: core
        continue-on-error: true
      - name: Run bandit on contrib
        run: uv run bandit -lll -iii -r . -f json -o ../bandit-contrib-report.json
        working-directory: contrib
        continue-on-error: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: bandit-report
          path: |
            bandit-core-report.json
            bandit-contrib-report.json
