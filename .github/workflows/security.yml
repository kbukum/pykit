name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        with:
          languages: python
          queries: security-and-quality
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2

  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - name: Export core requirements
        run: uv export --only-group dev --format requirements-txt --no-emit-workspace | grep -v '^-e ' > requirements-dev.txt
        working-directory: core
      - name: Audit core requirements
        run: uvx pip-audit -r core/requirements-dev.txt --strict --vulnerability-service osv
      - name: Export contrib requirements
        run: uv export --only-group dev --format requirements-txt --no-emit-workspace | grep -v '^-e ' > requirements-dev.txt
        working-directory: contrib
      - name: Audit contrib requirements
        run: uvx pip-audit -r contrib/requirements-dev.txt --strict --vulnerability-service osv

  bandit:
    name: Bandit SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - name: Sync core dev dependencies
        run: uv sync --only-group dev
        working-directory: core
      - name: Sync contrib dev dependencies
        run: uv sync --only-group dev
        working-directory: contrib
      - name: Run bandit on core
        run: uv run bandit -lll -iii -r packages/ -f json -o ../bandit-core-report.json
        working-directory: core
        continue-on-error: true
      - name: Run bandit on contrib
        run: uv run bandit -lll -iii -r . -f json -o ../bandit-contrib-report.json
        working-directory: contrib
        continue-on-error: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: bandit-report
          path: |
            bandit-core-report.json
            bandit-contrib-report.json
