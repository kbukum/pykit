    "pykit-inference",
    "pykit-dataset",
    "pykit-bench",
    "pykit-validation",
    "pykit-encryption",
    "pykit-util",
    "pykit-version",
    "pykit-component",
    "pykit-resilience",
    "pykit-schema",
    "pykit-di",
    "pykit-bootstrap",
    "pykit-messaging",
    "pykit-httpclient",
    "pykit-llm",
    "pykit-ai",
    "pykit-storage",
    "pykit-cache",
    "pykit-database",
    "pykit-dag",
    "pykit-authz",
    "pykit-grpc",
    "pykit-git",
    "pykit-observability",
    "pykit-stateful",
    "pykit-process",
    "pykit-sse",
    "pykit-worker",
    "pykit-workload",
    "pykit-discovery",
    "pykit-media",
    "pykit-security",
    "pykit-embedding",
    "pykit-vectorstore",
    "pykit-hook",
    "pykit-agent",
    "pykit-mcp",
    "pykit-skill",
    "pykit-transcription",
    "pykit-llm-common",
    "pykit-llm-openai",
    "pykit-llm-anthropic",
    "pykit-llm-gemini",
    "pytest",
    "pytest-asyncio",
    "pytest-benchmark",
    "pytest-cov",
    "pytest-xdist>=3.8.0",
    "pytest-timeout>=2.4.0",
    "ruff",
    "mypy",
    "import-linter",
    "aiosqlite",
    "argon2-cffi>=25.1.0",
]

[tool.uv]
constraint-dependencies = [
    "pydantic>=2.12.0,<3.0",
    "pydantic-settings>=2.7",
    "structlog>=25.1.0",
    "grpcio>=1.70",
    "grpcio-health-checking>=1.70",
    "grpcio-reflection>=1.70",
    "prometheus-client>=0.22",
    "httpx>=0.28",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "redis>=5.2",
    "aiokafka>=0.12",
    "opentelemetry-api>=1.30",
    "opentelemetry-sdk>=1.30",
    "pyjwt>=2.10",
    "cryptography>=44.0",
]

