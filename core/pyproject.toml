[[tool.importlinter.contracts]]
name = "Layer architecture"
type = "layers"
layers = [
    "pykit_agent | pykit_workload | pykit_process | pykit_git | pykit_testutil | pykit_integration",
    "pykit_skill",
    "pykit_inference | pykit_bench | pykit_dataset | pykit_transcription",
    "pykit_llm_common | pykit_llm_openai | pykit_llm_anthropic | pykit_llm_gemini",
    "pykit_llm | pykit_embedding | pykit_vectorstore | pykit_mcp",
    "pykit_ai",
    "pykit_server | pykit_grpc",
    "pykit_discovery | pykit_database | pykit_cache | pykit_storage | pykit_messaging | pykit_httpclient",
    "pykit_auth | pykit_authz | pykit_security",
    "pykit_pipeline | pykit_dag | pykit_worker | pykit_sse | pykit_stateful",
    "pykit_di | pykit_bootstrap | pykit_observability | pykit_chain",
    "pykit_hook | pykit_provider | pykit_component | pykit_resilience | pykit_schema",
    "pykit_validation | pykit_encryption | pykit_util | pykit_version | pykit_media",
    "pykit_errors | pykit_config | pykit_logging",
]

[[tool.importlinter.contracts]]
name = "Data core packages do not import optional adapters"
type = "forbidden"
source_modules = [
    "pykit_cache.backends",
    "pykit_cache.client",
    "pykit_cache.component",
    "pykit_cache.config",
    "pykit_cache.registry",
    "pykit_cache.typed_store",
    "pykit_storage.base",
    "pykit_storage.component",
    "pykit_storage.config",
    "pykit_storage.local",
    "pykit_storage.registry",
    "pykit_vectorstore.memory",
    "pykit_vectorstore.registry",
    "pykit_vectorstore.store",
]
forbidden_modules = [
    "pykit_cache_redis",
    "pykit_storage_s3",
    "pykit_vectorstore_qdrant",
]

[tool.bandit]
targets = ["packages"]
recursive = true
skips = ["B101"]
