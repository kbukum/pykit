"pykit-workload" = { workspace = true }
"pykit-transcription" = { workspace = true }
"pykit-llm-common" = { path = "../contrib/pykit-llm-common", editable = true }
"pykit-llm-openai" = { path = "../contrib/pykit-llm-openai", editable = true }
"pykit-llm-anthropic" = { path = "../contrib/pykit-llm-anthropic", editable = true }
"pykit-llm-gemini" = { path = "../contrib/pykit-llm-gemini", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages"]
addopts = "--tb=short -q --import-mode=importlib -n auto --dist worksteal -m 'not integration and not e2e and not benchmark'"
markers = [
    "unit: Fast isolated unit tests (no I/O, no network)",
    "integration: Integration tests requiring external services",
    "e2e: End-to-end tests (full stack, slow)",
    "benchmark: Performance benchmarks",
    "slow: mark test as slow-running",
]

[tool.coverage.run]
source_pkgs = [
    "pykit_errors",
    "pykit_config",
    "pykit_logging",
    "pykit_provider",
    "pykit_pipeline",
    "pykit_server",
    "pykit_observability",
    "pykit_testutil",
    "pykit_inference",
    "pykit_dataset",
    "pykit_bench",
    "pykit_validation",
    "pykit_encryption",
    "pykit_util",
    "pykit_version",
    "pykit_component",
    "pykit_resilience",
    "pykit_di",
    "pykit_bootstrap",
    "pykit_database",
    "pykit_cache",
    "pykit_storage",
    "pykit_messaging",
    "pykit_httpclient",
    "pykit_grpc",
    "pykit_auth",
    "pykit_authz",
    "pykit_dag",
    "pykit_worker",
    "pykit_sse",
    "pykit_stateful",
    "pykit_llm",
    "pykit_ai",
    "pykit_discovery",
    "pykit_process",
    "pykit_media",
    "pykit_security",
    "pykit_workload",
    "pykit_embedding",
    "pykit_vectorstore",
    "pykit_transcription",
    "pykit_skill",
    "pykit_llm_common",
    "pykit_llm_openai",
    "pykit_llm_anthropic",
    "pykit_llm_gemini",
]
branch = true
data_file = ".cache/coverage/.coverage"

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 85

[tool.ruff]
target-version = "py313"
line-length = 110
src = ["packages/*/src"]

