[tool.ruff.lint.per-file-ignores]
"**/tests/*.py" = ["E402", "S", "PLR", "N", "ANN", "T20", "PT"]
"**/tests/**/*.py" = ["S", "PLR", "N", "ANN", "T20", "PT"]
"**/benchmarks/*.py" = ["T20", "S", "PT"]
"examples/**/*.py" = ["T20", "S"]
"**/cli.py" = ["T20"]
"**/sources/*.py" = ["T20"]
"**/pykit_bench/*.py" = ["T20"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

