[project]
name = "pykit-core-workspace"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = []

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "pykit",
    "pykit-auth",
    "pykit-chain",
    "pykit-errors",
    "pykit-config",
    "pykit-integration",
