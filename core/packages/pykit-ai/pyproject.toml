[project]
name = "pykit-ai"
description = "Canonical AI vocabulary, prompts, vectors, and typed errors"
version = "0.1.0"
readme = "README.md"
license = { text = "MIT" }
keywords = ["ai", "llm", "prompt", "vector"]
requires-python = ">=3.13"
dependencies = [
    "packaging>=24.0",
    "pydantic>=2.12.0,<3.0",
    "pykit-schema",
]

[project.urls]
Homepage = "https://github.com/kbukum/pykit"
Documentation = "https://kbukum.github.io/pykit/"
Repository = "https://github.com/kbukum/pykit"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pykit_ai"]
