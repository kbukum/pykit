[project]
name = "pykit-skill"
description = "Skill manifests, loaders, registries, and verification contracts"
version = "0.1.0"
readme = "README.md"
license = { text = "MIT" }
keywords = ["skill", "agent", "ai"]
requires-python = ">=3.13"
dependencies = ["pydantic", "pyyaml>=6.0",
    "types-PyYAML>=6.0", "pykit-security"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pykit_skill"]
