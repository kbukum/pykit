schema_version: "1"
name: demo
version: 0.1.0
description: Demo
license: MIT
authors: [Ada]
references:
  tools: [read, write]
  prompts:
    - name: summarize
      version: 1.0.0
  resources: [docs]
  mcp_servers: [local]
requires:
  scopes: [db:read]
  capabilities: [filesystem]
human_approval:
  - step: publish
    when: before external write
    rationale: requires operator review
budgets:
  max_tokens: 100
  max_calls: 2
  max_cost: {amount: "1.25", currency: USD}
  wall_clock: PT60S
model_hints:
  preferred: [gpt-4o]
  reject: [slow-model]
progressive_disclosure:
  summary: Demo summary
  detail: Demo detail
scripts:
  - path: scripts/asset.sh
    description: inert helper
signature:
  algorithm: ed25519
  value: abc
  key_id: key-1
safety: mutating
