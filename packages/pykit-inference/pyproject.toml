[project]
name = "pykit-inference"
description = "Model-serving runtime inference abstractions and adapters"
version = "0.1.0"
readme = "README.md"
license = { text = "MIT" }
keywords = ["triton", "inference", "ml", "kserve", "serving"]
requires-python = ">=3.13"
dependencies = [
    "pykit-ai",
    "httpx>=0.28",
    "pykit-httpclient",
    "pydantic>=2.12.0,<3.0",
    "pykit-authz",
    "pykit-observability",
    "pykit-resilience",
    "pykit-tool",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pykit_inference"]

[project.optional-dependencies]
all = []
