[project]
name = "pykit-vectorstore-qdrant"
description = "Qdrant adapter for pykit-vectorstore"
version = "0.1.0"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
dependencies = [
    "pykit-vectorstore",
    "qdrant-client",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pykit_vectorstore_qdrant"]
