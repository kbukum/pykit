[project]
name = "pykit-messaging-rabbitmq"
description = "RabbitMQ adapter for pykit-messaging"
version = "0.1.0"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
dependencies = [
    "pykit-messaging",
    "aio-pika>=9.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pykit_messaging_rabbitmq"]
