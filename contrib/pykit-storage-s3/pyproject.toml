[project]
name = "pykit-storage-s3"
description = "S3 adapter for pykit-storage"
version = "0.1.0"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
dependencies = [
    "pykit-storage",
    "pykit-errors",
    "aioboto3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pykit_storage_s3"]
