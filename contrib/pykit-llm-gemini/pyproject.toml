[project]
name = "pykit-llm-gemini"
description = "Gemini adapter for pykit-llm"
version = "0.1.0"
license = { text = "MIT" }
requires-python = ">=3.13"
dependencies = [
    "pykit-ai",
    "pykit-llm",
    "pykit-httpclient",
    "pykit-embedding",
    "pykit-resilience",
    "opentelemetry-api",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pykit_llm_gemini"]
