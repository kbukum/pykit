[project]
name = "pykit-messaging-kafka"
description = "Kafka adapter for pykit-messaging"
version = "0.1.0"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
dependencies = [
    "pykit-messaging",
    "aiokafka",
    "cramjam>=2.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pykit_messaging_kafka"]
