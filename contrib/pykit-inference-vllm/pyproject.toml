[project]
name = "pykit-inference-vllm"
description = "vLLM adapter for pykit-inference"
version = "0.1.0"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
dependencies = [
    "pykit-inference",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pykit_inference_vllm"]
